name: YouTube Auto Shorts

on:
  workflow_dispatch:

  schedule:
    # 08:00 IST = 02:30 UTC
    - cron: "30 2 * * *"

    # 14:00 IST = 08:30 UTC
    - cron: "30 8 * * *"

    # 20:00 IST = 14:30 UTC
    - cron: "30 14 * * *"

permissions:
  contents: write

concurrency:
  group: youtube-auto-single-run
  cancel-in-progress: false

jobs:
  youtube-auto:
    runs-on: ubuntu-latest
    timeout-minutes: 50

    env:
      APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      VIZARD_API_KEY: ${{ secrets.VIZARD_API_KEY }}
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}

      # Official MrBeast YouTube channel
      MRBEAST_CHANNEL_ID: "UCX6OQ3DkcsbYNE6H8uQQuVA"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            requests \
            google-api-python-client \
            google-auth \
            google-auth-oauthlib \
            google-auth-httplib2 \
            google-api-core

      - name: Preflight YouTube OAuth
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          python - <<'PY2'
          import os, sys, requests

          cid = os.environ["YOUTUBE_CLIENT_ID"]
          secret = os.environ["YOUTUBE_CLIENT_SECRET"]
          refresh = os.environ["YOUTUBE_REFRESH_TOKEN"]

          if not cid or not secret or not refresh:
              print("ERROR: YouTube OAuth secret is missing.")
              sys.exit(1)

          r = requests.post(
              "https://oauth2.googleapis.com/token",
              data={
                  "client_id": cid,
                  "client_secret": secret,
                  "refresh_token": refresh,
                  "grant_type": "refresh_token",
              },
              timeout=30,
          )

          if r.status_code != 200:
              try:
                  body = r.json()
                  err = body.get("error", "unknown")
                  desc = body.get("error_description", "")
              except Exception:
                  err = "unknown"
                  desc = r.text[:200]

              print(f"YouTube OAuth preflight FAILED: {err} {desc}")
              print("Vizard will NOT be called.")
              sys.exit(1)

          data = r.json()
          if not data.get("access_token"):
              print("YouTube OAuth preflight FAILED: no access token returned.")
              sys.exit(1)

          print("YouTube OAuth preflight: OK")
          print("Access token received successfully.")
          PY2

      - name: Run automation
        run: python automation.py

      - name: Save automation history
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/used_videos.txt data/used_clips.txt data/upload_history.json

          if git diff --cached --quiet; then
            echo "No history changes to commit."
          else
            git commit -m "Update YouTube automation history"
            git push
          fi
