name: YouTube Auto 3x Daily

on:
  workflow_dispatch:

  schedule:
    - cron: "0 8 * * *"
      timezone: "Asia/Kolkata"

    - cron: "0 14 * * *"
      timezone: "Asia/Kolkata"

    - cron: "0 20 * * *"
      timezone: "Asia/Kolkata"


permissions:
  contents: write


jobs:

  youtube-auto:

    runs-on: ubuntu-latest


    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4

        with:
          fetch-depth: 0


      # ============================================================
      # 2. PYTHON
      # ============================================================

      - name: Setup Python
        uses: actions/setup-python@v5

        with:
          python-version: "3.12"


      # ============================================================
      # 3. DEPENDENCIES
      # ============================================================

      - name: Install dependencies
        run: |

          python -m pip install --upgrade pip

          pip install \
            requests \
            google-api-python-client \
            google-auth \
            google-auth-oauthlib \
            google-auth-httplib2


      # ============================================================
      # 4. STATE
      # ============================================================

      - name: Create state folder
        run: |

          mkdir -p data

          touch data/used_videos.txt


      # ============================================================
      # 5. MAIN AUTOMATION
      # ============================================================

      - name: Run YouTube automation

        env:

          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}

          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}

          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}

          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}

          VIZARD_API_KEY: ${{ secrets.VIZARD_API_KEY }}

          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}

          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}


        run: |

          cat > automation.py <<'PY'

          import os
          import re
          import json
          import time
          import math
          import random
          import requests

          from datetime import datetime, timezone

          from google.oauth2.credentials import Credentials

          from googleapiclient.discovery import build

          from googleapiclient.http import MediaFileUpload


          # ==========================================================
          # CONFIG
          # ==========================================================

          YT_API = "https://www.googleapis.com/youtube/v3"

          VIZARD_CREATE = (
              "https://elb-api.vizard.ai/"
              "hvizard-server-front/open-api/v1/project/create"
          )

          VIZARD_QUERY = (
              "https://elb-api.vizard.ai/"
              "hvizard-server-front/open-api/v1/project/query/{}"
          )


          YT_KEY = os.environ["YOUTUBE_API_KEY"]

          YT_CLIENT_ID = os.environ["YOUTUBE_CLIENT_ID"]

          YT_CLIENT_SECRET = os.environ["YOUTUBE_CLIENT_SECRET"]

          YT_REFRESH = os.environ["YOUTUBE_REFRESH_TOKEN"]

          VIZARD_KEY = os.environ["VIZARD_API_KEY"]

          TG_TOKEN = os.environ["TELEGRAM_BOT_TOKEN"]

          TG_CHAT = os.environ["TELEGRAM_CHAT_ID"]


          STATE_FILE = "data/used_videos.txt"


          # ==========================================================
          # TELEGRAM
          # ==========================================================

          def telegram(message):

              try:

                  url = (
                      "https://api.telegram.org/"
                      f"bot{TG_TOKEN}/sendMessage"
                  )

                  response = requests.post(

                      url,

                      json={
                          "chat_id": TG_CHAT,
                          "text": message,
                          "disable_web_page_preview": True
                      },

                      timeout=30
                  )

                  print(
                      "Telegram:",
                      response.status_code
                  )

              except Exception as e:

                  print(
                      "Telegram notification failed:",
                      repr(e)
                  )


          def fail(message):

              telegram(
                  "🚨 YouTube Automation ERROR\n\n"
                  + message
              )

              raise RuntimeError(message)


          def skip_run(message):

              telegram(
                  "⚠️ YouTube Automation SKIPPED\n\n"
                  + message
              )

              print(
                  "SKIPPED:",
                  message
              )

              # Important:
              # Don't make GitHub show a red failure when
              # there was simply no valid source available.
              return


          # ==========================================================
          # RETRY HELPER
          # ==========================================================

          def request_with_retry(
              method,
              url,
              *,
              attempts=5,
              timeout=60,
              **kwargs
          ):

              last_error = None

              for attempt in range(1, attempts + 1):

                  try:

                      response = requests.request(
                          method,
                          url,
                          timeout=timeout,
                          **kwargs
                      )

                      # Retry temporary server/network errors.
                      if response.status_code >= 500:

                          raise RuntimeError(
                              f"HTTP {response.status_code}: "
                              f"{response.text[:500]}"
                          )

                      return response

                  except Exception as e:

                      last_error = e

                      print(
                          f"Request attempt "
                          f"{attempt}/{attempts} failed:",
                          repr(e)
                      )

                      if attempt < attempts:

                          wait = min(
                              60,
                              2 ** attempt
                          )

                          wait += random.random()

                          time.sleep(wait)

              raise RuntimeError(
                  f"Request failed after {attempts} attempts: "
                  f"{last_error}"
              )


          # ==========================================================
          # STATE
          # ==========================================================

          def get_used():

              if not os.path.exists(
                  STATE_FILE
              ):

                  return set()


              with open(
                  STATE_FILE,
                  "r",
                  encoding="utf-8"
              ) as f:

                  return {
                      line.strip()
                      for line in f
                      if line.strip()
                  }


          def save_used(video_id):

              with open(
                  STATE_FILE,
                  "a",
                  encoding="utf-8"
              ) as f:

                  f.write(
                      video_id + "\n"
                  )


          # ==========================================================
          # YOUTUBE API
          # ==========================================================

          def youtube_get(
              path,
              params
          ):

              params = dict(params)

              params["key"] = YT_KEY


              response = request_with_retry(

                  "GET",

                  YT_API + path,

                  params=params,

                  timeout=45
              )


              if response.status_code != 200:

                  fail(
                      "YouTube API error\n\n"
                      f"HTTP: {response.status_code}\n\n"
                      f"{response.text[:2500]}"
                  )


              try:

                  return response.json()

              except Exception:

                  fail(
                      "YouTube returned invalid JSON.\n\n"
                      + response.text[:1500]
                  )


          # ==========================================================
          # ISO DURATION
          # ==========================================================

          def iso_duration_seconds(value):

              match = re.fullmatch(

                  r"PT"
                  r"(?:(\d+)H)?"
                  r"(?:(\d+)M)?"
                  r"(?:(\d+)S)?",

                  value or ""
              )


              if not match:

                  return 0


              hours = int(
                  match.group(1) or 0
              )

              minutes = int(
                  match.group(2) or 0
              )

              seconds = int(
                  match.group(3) or 0
              )


              return (
                  hours * 3600
                  + minutes * 60
                  + seconds
              )


          # ==========================================================
          # POPULAR SEARCH TOPICS
          #
          # These are only search topics.
          # Final source must still pass the rights check.
          # ==========================================================

          POPULAR_SEARCHES = [

              "MrBeast podcast",
              "MrBeast interview",

              "Elon Musk podcast",
              "Elon Musk interview",

              "Mark Zuckerberg podcast",
              "Mark Zuckerberg interview",

              "Bill Gates podcast",
              "Bill Gates interview",

              "Jeff Bezos podcast",
              "Jeff Bezos interview",

              "Cristiano Ronaldo interview",

              "Virat Kohli interview",

              "Shah Rukh Khan interview",

              "Amitabh Bachchan interview",

              "Andrew Huberman podcast",

              "Lex Fridman podcast",

              "Joe Rogan podcast",

              "technology podcast",

              "AI podcast",

              "business podcast",

              "entrepreneur podcast",

              "science podcast",

              "space podcast",

              "future technology podcast",

              "innovation interview",

              "interesting interview",

              "viral podcast",

              "motivational podcast",

              "interesting conversation"
          ]


          GENERAL_SEARCHES = [

              "technology",
              "artificial intelligence",
              "science",
              "space",
              "business",
              "entrepreneur",
              "innovation",
              "future technology",
              "interesting facts",
              "engineering",
              "education",
              "nature",
              "psychology",
              "motivation"
          ]


          # ==========================================================
          # BUILD SOURCE
          # ==========================================================

          def make_candidate(
              item,
              used
          ):

              video_id = item.get("id")

              if not video_id:

                  return None


              if video_id in used:

                  return None


              snippet = item.get(
                  "snippet",
                  {}
              )

              content = item.get(
                  "contentDetails",
                  {}
              )

              stats = item.get(
                  "statistics",
                  {}
              )


              # ------------------------------------------------------
              # RIGHTS CHECK
              #
              # We only accept videos that YouTube marks
              # Creative Commons.
              # ------------------------------------------------------

              license_name = (
                  snippet.get("license")
                  or ""
              )


              if license_name != "creativeCommon":

                  return None


              duration = iso_duration_seconds(

                  content.get(
                      "duration",
                      ""
                  )
              )


              # Vizard long-form clipping needs a meaningful
              # source video. No artificial 60-180 sec restriction.
              if duration < 60:

                  return None


              views = int(

                  stats.get(
                      "viewCount",
                      0
                  )
                  or 0
              )


              likes = int(

                  stats.get(
                      "likeCount",
                      0
                  )
                  or 0
              )


              comments = int(

                  stats.get(
                      "commentCount",
                      0
                  )
                  or 0
              )


              title = snippet.get(
                  "title",
                  "Untitled"
              )


              channel = snippet.get(
                  "channelTitle",
                  "Unknown"
              )


              description = snippet.get(
                  "description",
                  ""
              )


              return {

                  "id": video_id,

                  "title": title,

                  "channel": channel,

                  "description": description,

                  "url":
                      "https://www.youtube.com/watch?v="
                      + video_id,

                  "duration": duration,

                  "views": views,

                  "likes": likes,

                  "comments": comments,

                  "license": "creativeCommon"
              }


          # ==========================================================
          # SEARCH
          # ==========================================================

          def search_source_query(
              query,
              used
          ):

              print(
                  "\nSEARCH:",
                  query
              )


              data = youtube_get(

                  "/search",

                  {

                      "part":
                          "snippet",

                      "q":
                          query,

                      "type":
                          "video",

                      # Rights-cleared source only.
                      "videoLicense":
                          "creativeCommon",

                      # No short-video restriction.
                      "videoDuration":
                          "any",

                      "order":
                          "viewCount",

                      "maxResults":
                          50,

                      "safeSearch":
                          "moderate",

                      "relevanceLanguage":
                          "en"
                  }
              )


              ids = []


              for item in data.get(
                  "items",
                  []
              ):

                  video_id = (
                      item
                      .get("id", {})
                      .get("videoId")
                  )


                  if (

                      video_id

                      and

                      video_id not in used

                  ):

                      ids.append(
                          video_id
                      )


              if not ids:

                  return []


              # YouTube videos.list can retrieve the
              # duration/license/statistics for the candidates.
              details = youtube_get(

                  "/videos",

                  {

                      "part":
                          "snippet,"
                          "contentDetails,"
                          "statistics",

                      "id":
                          ",".join(
                              ids[:50]
                          )
                  }
              )


              candidates = []


              for item in details.get(
                  "items",
                  []
              ):

                  candidate = make_candidate(
                      item,
                      used
                  )


                  if candidate:

                      candidates.append(
                          candidate
                      )


              return candidates


          # ==========================================================
          # SOURCE SCORE
          # ==========================================================

          def source_score(
              candidate
          ):

              views = max(
                  1,
                  candidate["views"]
              )

              likes = max(
                  0,
                  candidate["likes"]
              )

              comments = max(
                  0,
                  candidate["comments"]
              )


              score = math.log10(
                  views
              )


              # Engagement gives a small bonus.
              score += math.log10(
                  likes + 1
              ) * 0.20


              score += math.log10(
                  comments + 1
              ) * 0.10


              title = (
                  candidate["title"]
                  .lower()
              )


              strong_words = [

                  "podcast",
                  "interview",
                  "conversation",
                  "full episode",
                  "documentary",
                  "talk",
                  "discussion"
              ]


              for word in strong_words:

                  if word in title:

                      score += 0.40


              return score


          # ==========================================================
          # FIND BEST SOURCE
          # ==========================================================

          def find_source():

              used = get_used()


              all_candidates = []


              # ------------------------------------------------------
              # Popular searches
              # ------------------------------------------------------

              for query in POPULAR_SEARCHES:

                  try:

                      found = search_source_query(
                          query,
                          used
                      )

                      all_candidates.extend(
                          found
                      )


                      print(
                          f"{query}: "
                          f"{len(found)} candidates"
                      )


                  except Exception as e:

                      print(
                          "Search failed:",
                          query,
                          repr(e)
                      )


                  # Stop after enough candidates.
                  if len(all_candidates) >= 50:

                      break


              # ------------------------------------------------------
              # General fallback
              # ------------------------------------------------------

              if len(all_candidates) < 10:

                  for query in GENERAL_SEARCHES:

                      try:

                          found = search_source_query(
                              query,
                              used
                          )

                          all_candidates.extend(
                              found
                          )


                      except Exception as e:

                          print(
                              "Fallback search failed:",
                              query,
                              repr(e)
                          )


                      if len(all_candidates) >= 70:

                          break


              # ------------------------------------------------------
              # Deduplicate
              # ------------------------------------------------------

              unique = {}


              for candidate in all_candidates:

                  unique[
                      candidate["id"]
                  ] = candidate


              candidates = list(
                  unique.values()
              )


              if not candidates:

                  return None


              # ------------------------------------------------------
              # Popularity ranking
              # ------------------------------------------------------

              candidates.sort(

                  key=source_score,

                  reverse=True
              )


              best = candidates[0]


              print(
                  "\nBEST SOURCE:"
              )


              print(

                  json.dumps(
                      best,
                      indent=2,
                      ensure_ascii=False
                  )
              )


              return best


          # ==========================================================
          # VIZARD CREATE
          # ==========================================================

          def vizard_create(
              source
          ):

              headers = {

                  "Content-Type":
                      "application/json",

                  "VIZARDAI_API_KEY":
                      VIZARD_KEY
              }


              payload = {

                  "lang":
                      "auto",

                  # Vizard chooses a 30-60 second clip.
                  "preferLength":
                      [2],

                  "videoUrl":
                      source["url"],

                  # YouTube source.
                  "videoType":
                      2,

                  # 9:16 Shorts.
                  "ratioOfClip":
                      1,

                  # Original voice remains.
                  # No AI voice/TTS is requested.
                  "subtitleSwitch":
                      1,

                  "headlineSwitch":
                      1,

                  "removeSilenceSwitch":
                      1,

                  # Ask Vizard for several top candidates.
                  "maxClipNumber":
                      10,

                  # V1 has the standard billing model.
                  "clipModel":
                      "clip_v1",

                  "projectName":
                      source["title"][:100]
              }


              response = request_with_retry(

                  "POST",

                  VIZARD_CREATE,

                  headers=headers,

                  json=payload,

                  attempts=5,

                  timeout=120
              )


              if response.status_code != 200:

                  fail(

                      "Vizard API request failed.\n\n"

                      f"HTTP: "
                      f"{response.status_code}\n\n"

                      f"{response.text[:3000]}"
                  )


              try:

                  data = response.json()

              except Exception:

                  fail(
                      "Vizard returned invalid JSON.\n\n"
                      + response.text[:2000]
                  )


              code = data.get(
                  "code"
              )


              if code != 2000:

                  fail(

                      "Vizard rejected the source.\n\n"

                      + json.dumps(
                          data,
                          ensure_ascii=False
                      )[:3000]
                  )


              project_id = data.get(
                  "projectId"
              )


              if not project_id:

                  fail(

                      "Vizard returned no projectId.\n\n"

                      + json.dumps(
                          data,
                          ensure_ascii=False
                      )[:2500]
                  )


              return project_id


          # ==========================================================
          # WAIT FOR VIZARD
          # ==========================================================

          def vizard_wait(
              project_id
          ):

              headers = {

                  "VIZARDAI_API_KEY":
                      VIZARD_KEY
              }


              # 60 x 30 sec = ~30 minutes.
              for attempt in range(
                  1,
                  61
              ):

                  try:

                      response = request_with_retry(

                          "GET",

                          VIZARD_QUERY.format(
                              project_id
                          ),

                          headers=headers,

                          attempts=4,

                          timeout=90
                      )


                      if response.status_code != 200:

                          print(
                              "Vizard query HTTP:",
                              response.status_code
                          )

                          time.sleep(30)

                          continue


                      data = response.json()


                  except Exception as e:

                      print(
                          "Vizard polling error:",
                          repr(e)
                      )

                      time.sleep(30)

                      continue


                  code = data.get(
                      "code"
                  )


                  videos = (
                      data.get("videos")
                      or []
                  )


                  # --------------------------------------------------
                  # Vizard says clips are ready.
                  # --------------------------------------------------

                  if videos:

                      valid = [

                          video

                          for video in videos

                          if video.get(
                              "videoUrl"
                          )
                      ]


                      if valid:

                          # Vizard documents viralScore as 0-10
                          # and says results are sorted by viral score.
                          #
                          # We explicitly calculate it too, so the
                          # highest-highlight clip is selected.
                          def viral_score(video):

                              raw = video.get(
                                  "viralScore",
                                  0
                              )

                              try:

                                  return float(
                                      raw
                                  )

                              except Exception:

                                  return 0.0


                          valid.sort(

                              key=viral_score,

                              reverse=True
                          )


                          best = valid[0]


                          print(
                              "\nBEST VIZARD CLIP:"
                          )


                          print(

                              json.dumps(
                                  best,
                                  indent=2,
                                  ensure_ascii=False
                              )
                          )


                          return best


                  # --------------------------------------------------
                  # Permanent processing errors
                  # --------------------------------------------------

                  if code in (

                      4001,
                      4002,
                      4003,
                      4004,
                      4005,
                      4006,
                      4007,
                      4008,
                      4009,
                      4010

                  ):

                      fail(

                          "Vizard processing failed.\n\n"

                          + json.dumps(
                              data,
                              ensure_ascii=False
                          )[:3000]
                      )


                  print(

                      "Vizard processing:",
                      f"{attempt}/60",
                      "code=",
                      code
                  )


                  time.sleep(30)


              fail(
                  "Vizard processing timed out "
                  "after approximately 30 minutes."
              )


          # ==========================================================
          # DOWNLOAD CLIP
          # ==========================================================

          def download_video(
              url
          ):

              output = (
                  "short.mp4"
              )


              response = request_with_retry(

                  "GET",

                  url,

                  stream=True,

                  attempts=5,

                  timeout=180
              )


              if response.status_code != 200:

                  fail(

                      "Could not download "
                      "Vizard clip.\n\n"

                      f"HTTP: "
                      f"{response.status_code}"
                  )


              with open(
                  output,
                  "wb"
              ) as file:

                  for chunk in response.iter_content(
                      1024 * 1024
                  ):

                      if chunk:

                          file.write(
                              chunk
                          )


              if not os.path.exists(
                  output
              ):

                  fail(
                      "Vizard output file "
                      "was not created."
                  )


              size = os.path.getsize(
                  output
              )


              if size < 10_000:

                  fail(
                      "Vizard output file is "
                      "unexpectedly small."
                  )


              print(
                  "Downloaded:",
                  size,
                  "bytes"
              )


              return output


          # ==========================================================
          # YOUTUBE AUTH
          # ==========================================================

          def youtube_service():

              refresh = (
                  YT_REFRESH.strip()
              )


              if refresh.startswith(
                  "{"
              ):

                  token_data = json.loads(
                      refresh
                  )


                  refresh_token = (
                      token_data.get(
                          "refresh_token"
                      )
                  )


                  access_token = (
                      token_data.get(
                          "token"
                      )
                  )


              else:

                  refresh_token = refresh

                  access_token = None


              if not refresh_token:

                  fail(
                      "YOUTUBE_REFRESH_TOKEN "
                      "does not contain a refresh token."
                  )


              credentials = Credentials(

                  token=access_token,

                  refresh_token=refresh_token,

                  token_uri=(
                      "https://oauth2.googleapis.com/token"
                  ),

                  client_id=YT_CLIENT_ID,

                  client_secret=YT_CLIENT_SECRET,

                  scopes=[
                      "https://www.googleapis.com/"
                      "auth/youtube.upload"
                  ]
              )


              return build(

                  "youtube",

                  "v3",

                  credentials=credentials,

                  cache_discovery=False
              )


          # ==========================================================
          # UPLOAD
          # ==========================================================

          def upload_youtube(

              video_path,

              source,

              vizard_clip

          ):

              youtube = youtube_service()


              title = (

                  vizard_clip.get(
                      "title"
                  )

                  or

                  source.get(
                      "title"
                  )

                  or

                  "Amazing Podcast Highlight"
              )


              title = re.sub(

                  r"\s+",

                  " ",

                  title
              ).strip()


              if not title:

                  title = (
                      "Amazing Podcast Highlight"
                  )


              # YouTube title limit.
              title = title[:95]


              viral_score = (

                  vizard_clip.get(
                      "viralScore",
                      "N/A"
                  )
              )


              viral_reason = (

                  vizard_clip.get(
                      "viralReason",
                      ""
                  )
              )


              description = (

                  "🎬 AI-selected highlight Short\n\n"

                  "Original source:\n"

                  f"{source['url']}\n\n"

                  "Original video:\n"

                  f"{source['title']}\n\n"

                  "Original channel:\n"

                  f"{source['channel']}\n\n"

                  "Source license indicated by YouTube:\n"

                  "Creative Commons\n\n"

                  "This Short uses the original clip audio/voice.\n\n"

                  f"Vizard viral score: "
                  f"{viral_score}\n\n"

                  f"Highlight reason: "
                  f"{viral_reason[:1000]}\n\n"

                  "#Shorts #Podcast #Highlights"
              )


              body = {

                  "snippet": {

                      "title":
                          title,

                      "description":
                          description,

                      "tags": [

                          "Shorts",

                          "YouTube Shorts",

                          "podcast",

                          "highlights",

                          "viral",

                          "trending",

                          "interview",

                          "shorts"

                      ],

                      "categoryId":
                          "22"
                  },


                  "status": {

                      "privacyStatus":
                          "public",

                      "selfDeclaredMadeForKids":
                          False
                  }
              }


              media = MediaFileUpload(

                  video_path,

                  mimetype="video/mp4",

                  resumable=True,

                  chunksize=8 * 1024 * 1024
              )


              upload_request = youtube.videos().insert(

                  part="snippet,status",

                  body=body,

                  media_body=media
              )


              # Retry resumable upload.
              response = None


              for attempt in range(
                  1,
                  6
              ):

                  try:

                      print(
                          "YouTube upload attempt:",
                          attempt
                      )


                      response = (
                          upload_request.execute(
                              num_retries=3
                          )
                      )


                      break


                  except Exception as e:

                      print(
                          "Upload failed:",
                          repr(e)
                      )


                      if attempt == 5:

                          raise


                      time.sleep(
                          min(
                              60,
                              attempt * 10
                          )
                      )


              if not response:

                  fail(
                      "YouTube upload returned "
                      "no response."
                  )


              video_id = response.get(
                  "id"
              )


              if not video_id:

                  fail(

                      "YouTube upload returned "
                      "no video ID.\n\n"

                      + json.dumps(
                          response,
                          ensure_ascii=False
                      )[:2000]
                  )


              return (
                  video_id,
                  title
              )


          # ==========================================================
          # MAIN
          # ==========================================================

          def main():

              telegram(

                  "🤖 YouTube Automation started\n\n"

                  "🔎 Searching popular "
                  "rights-cleared long-form sources..."
              )


              source = find_source()


              # ------------------------------------------------------
              # No source
              # ------------------------------------------------------

              if not source:

                  skip_run(

                      "No unused Creative Commons "
                      "long-form source was available "
                      "in this run.\n\n"

                      "🔁 The next scheduled run "
                      "will automatically try again.\n\n"

                      "No unlicensed random video "
                      "was uploaded."
                  )

                  return


              # ------------------------------------------------------
              # Source info
              # ------------------------------------------------------

              total_seconds = (
                  source["duration"]
              )


              hours = (
                  total_seconds // 3600
              )


              minutes = (
                  total_seconds % 3600
              ) // 60


              seconds = (
                  total_seconds % 60
              )


              telegram(

                  "🎯 SOURCE FOUND\n\n"

                  f"👤 {source['channel']}\n"

                  f"🎬 {source['title']}\n\n"

                  f"👀 Views: "
                  f"{source['views']:,}\n"

                  f"⏱ Length: "
                  f"{hours}h "
                  f"{minutes}m "
                  f"{seconds}s\n\n"

                  "📜 License: "
                  "Creative Commons\n\n"

                  "🎬 Sending long video to Vizard..."
              )


              # ------------------------------------------------------
              # Vizard
              # ------------------------------------------------------

              project_id = vizard_create(
                  source
              )


              telegram(

                  "🎬 Vizard processing started\n\n"

                  f"Project: {project_id}\n\n"

                  "🧠 Finding multiple highlights...\n"

                  "🔥 Then the highest viral-score "
                  "highlight will be selected."
              )


              vizard_clip = vizard_wait(
                  project_id
              )


              output_url = (
                  vizard_clip.get(
                      "videoUrl"
                  )
              )


              if not output_url:

                  fail(
                      "Vizard finished but "
                      "returned no video URL."
                  )


              viral_score = (
                  vizard_clip.get(
                      "viralScore",
                      "N/A"
                  )
              )


              viral_reason = (
                  vizard_clip.get(
                      "viralReason",
                      ""
                  )
              )


              telegram(

                  "🔥 BEST HIGHLIGHT SELECTED\n\n"

                  f"⭐ Viral score: "
                  f"{viral_score}/10\n\n"

                  f"💡 {viral_reason[:800]}\n\n"

                  "🎙️ Original clip audio retained.\n"

                  "⬇️ Downloading..."
              )


              # ------------------------------------------------------
              # Download
              # ------------------------------------------------------

              video_path = download_video(
                  output_url
              )


              telegram(

                  "📤 Uploading best highlight "
                  "to YouTube..."
              )


              # ------------------------------------------------------
              # Upload
              # ------------------------------------------------------

              video_id, title = upload_youtube(

                  video_path,

                  source,

                  vizard_clip
              )


              # Only mark source used AFTER
              # successful YouTube upload.
              save_used(
                  source["id"]
              )


              yt_url = (
                  "https://www.youtube.com/watch?v="
                  + video_id
              )


              telegram(

                  "✅ VIDEO UPLOADED SUCCESSFULLY\n\n"

                  f"🎬 {title}\n\n"

                  f"⭐ Highlight score: "
                  f"{viral_score}/10\n\n"

                  f"📺 {yt_url}\n\n"

                  "🎙️ Original voice retained\n"

                  "📜 Rights-cleared source\n\n"

                  f"🕐 "
                  f"{datetime.now(timezone.utc).isoformat()}"
              )


              print(
                  "SUCCESS:",
                  yt_url
              )


          # ==========================================================
          # START
          # ==========================================================

          if __name__ == "__main__":

              try:

                  main()

              except Exception as error:

                  print(
                      "FATAL ERROR:",
                      repr(error)
                  )

                  raise

          PY


          # ==========================================================
          # RUN
          # ==========================================================

          python automation.py


